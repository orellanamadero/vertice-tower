# Traefik (el proxy de Dokploy) termina el HTTPS y nos manda X-Forwarded-Proto.
# Si viene ese header, lo respetamos; si no (acceso directo), usamos $scheme.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Archivos estáticos de Django (admin, DRF browsable API, etc.)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Archivos multimedia subidos (imágenes de proyectos, etc.)
    location /media/ {
        alias /app/media/;
    }

    # API y admin de Django, proxied al servicio "backend"
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Admin de Django (distinto de /admin/, que es el panel propio del frontend)
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Build de React (SPA con react-router)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # tours 360
    location /tours/ {
        alias /app/tours/;
        try_files $uri $uri/ =404;

        sendfile on;

        location ~* \.(jpg|jpeg|png|webp|ktx|ktx2|bin|wasm|js|css)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
